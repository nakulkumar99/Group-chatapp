<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dev Password Reset</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        width: min(420px, 90vw);
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 14px;
        padding: 24px;
      }
      h1 { font-size: 18px; margin: 0 0 6px; }
      p { font-size: 14px; line-height: 1.5; color: #94a3b8; }
      label { display: block; font-size: 13px; margin: 14px 0 6px; color: #cbd5e1; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #0f172a;
        color: #e2e8f0;
        font-size: 14px;
      }
      button {
        margin-top: 18px;
        width: 100%;
        padding: 11px;
        border: 0;
        border-radius: 8px;
        background: #6366f1;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      #status { margin-top: 14px; }
      .ok { color: #4ade80; }
      .err { color: #f87171; }
      .hint { font-size: 12px; margin-top: 18px; color: #64748b; }
    </style>
  </head>
  <body>
    <main>
      <h1>Dev-only password reset</h1>
      <p>
        This page uses the Supabase session already stored in this browser. It only works if
        you are currently signed in.
      </p>

      <p id="status">Checking session…</p>

      <form id="form" hidden>
        <label for="password">New password</label>
        <input id="password" type="password" autocomplete="new-password" minlength="8" required />
        <label for="confirm">Confirm new password</label>
        <input id="confirm" type="password" autocomplete="new-password" minlength="8" required />
        <button id="submit" type="submit">Update password</button>
      </form>

      <p class="hint">
        Remove this file after use. Never deploy it to production.
      </p>
    </main>

    <script type="module">
      import { supabase } from "/src/integrations/supabase/client.ts";

      const status = document.getElementById("status");
      const form = document.getElementById("form");
      const submit = document.getElementById("submit");

      const show = (message, kind = "") => {
        status.textContent = message;
        status.className = kind;
      };

      const { data: { session }, error } = await supabase.auth.getSession();

      if (error) {
        show(`Session error: ${error.message}`, "err");
      } else if (!session) {
        show(
          "No active session in this browser. Sign in first, or reset the password from the Supabase dashboard.",
          "err"
        );
      } else {
        show(`Signed in as ${session.user.email ?? "no email"} — user ${session.user.id}`, "ok");
        form.hidden = false;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirm").value;

        if (password !== confirm) {
          show("Passwords do not match.", "err");
          return;
        }

        submit.disabled = true;
        show("Updating password…");

        const { error: updateError } = await supabase.auth.updateUser({ password });

        submit.disabled = false;

        if (updateError) {
          show(`Failed: ${updateError.message}`, "err");
          return;
        }

        form.hidden = true;
        show("Password updated. You can now sign in with the new password.", "ok");
      });
    </script>
  </body>
</html>
